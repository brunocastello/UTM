name: PPC guest tools
# Mac OS X PowerPC (Tiger/Leopard) guest helpers, cross-built on Linux with GCC/clang +
# cctools-port + MacOSX10.4u SDK (ghcr.io/variantxyz/gcc-powerpc-apple-darwin8).
on:
  push:
    branches: [ r300 ]
    paths: [ 'guest-kit/ppc/**', .github/workflows/ppc-guest-tools.yml ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    container: ghcr.io/variantxyz/gcc-powerpc-apple-darwin8:build-gcc-14.2-MacOSXSDK10.4u
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: guest-kit/ppc
      - name: Toolchain inventory
        run: |
          ls /usr/local/bin | head -50
          powerpc-apple-darwin8-gcc --version || true
          clang --version || true
          ls /usr/local/MacOSX10.4u.sdk/System/Library/Frameworks | head -40
      - name: GCC Objective-C literals
        continue-on-error: true
        run: |
          SDK=/usr/local/MacOSX10.4u.sdk
          powerpc-apple-darwin8-gcc -x objective-c -fnext-runtime -mmacosx-version-min=10.4 -isysroot $SDK \
            guest-kit/ppc/probe/literals.m -framework Foundation -o /tmp/lit-gcc && file /tmp/lit-gcc
      - name: clang Objective-C for ppc-darwin8
        continue-on-error: true
        run: |
          SDK=/usr/local/MacOSX10.4u.sdk
          clang -target powerpc-apple-darwin8 -fobjc-runtime=macosx-fragile-10.4 -mmacosx-version-min=10.4 \
            -isysroot $SDK -c guest-kit/ppc/probe/literals.m -o /tmp/lit.o && file /tmp/lit.o && \
          powerpc-apple-darwin8-ld -arch ppc -macosx_version_min 10.4 -syslibroot $SDK -lcrt1.o /tmp/lit.o \
            -framework Foundation -lSystem -o /tmp/lit-clang && file /tmp/lit-clang
